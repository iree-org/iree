# Workflow for MIPS64 Release 6 + MSA (128-bit SIMD) NATIVE llvm-cpu codegen
# cross-compilation and test jobs, run under QEMU user-mode emulation. This is
# the codegen counterpart to pkgci_test_mips64.yml (which is the scalar r2 /
# VMVX-only runtime). The concurrency of this workflow is controlled by the
# caller's job.
#
# Like the VMVX runtime job this needs no custom-hosted toolchain or QEMU: the
# r6 cross GCC (mipsisa64r6el-linux-gnuabi64, which ships the mips64r6 /
# NaN-2008 / n64 compiler + sysroot that the generic r2 toolchain lacks) and
# qemu-mips64el both come from the Ubuntu archive. The build/test scripts
# default to the r6 apt toolchain, so no overrides are required here.

name: PkgCI Test MIPS64 r6

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      write-caches:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      write-caches:
        required: true
        type: string

permissions:
  contents: read

jobs:
  mips64r6:
    runs-on: ubuntu-24.04
    env:
      PACKAGE_DOWNLOAD_DIR: ${{ github.workspace }}/.packages
      VENV_DIR: ${{ github.workspace }}/.venv
      GH_TOKEN: ${{ github.token }}
      IREE_TARGET_BUILD_DIR: build-mips-r6
    steps:
      # General setup.
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Checking out runtime submodules"
        run: ./build_tools/scripts/git/update_runtime_submodules.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must match the subset of versions built in pkgci_build_packages.
          python-version: "3.11"
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          save: ${{ inputs.write-caches == 1 }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.artifact_run_id == '' }}
        with:
          name: linux_x86_64_release_packages
          path: ${{ env.PACKAGE_DOWNLOAD_DIR }}
      - name: Install build and QEMU dependencies
        # The mipsisa64r6el-linux-gnuabi64 cross toolchain provides the r6 /
        # NaN-2008 GCC; libc6-dev-mips64r6el-cross provides the
        # /usr/mipsisa64r6el-linux-gnuabi64 sysroot used as the QEMU loader
        # prefix (and the C++/gcc runtime libs the test binaries load);
        # qemu-user provides qemu-mips64el.
        run: |
          sudo apt update
          sudo apt install -y ninja-build \
            gcc-mipsisa64r6el-linux-gnuabi64 g++-mipsisa64r6el-linux-gnuabi64 \
            libc6-dev-mips64r6el-cross qemu-user
      - name: Setup base venv
        run: |
          ./build_tools/pkgci/setup_venv.py ${VENV_DIR} \
            --artifact-path=${PACKAGE_DOWNLOAD_DIR} \
            --fetch-gh-workflow=${{ inputs.artifact_run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build mips64 r6 + MSA (native llvm-cpu codegen)
        env:
          IREE_HOST_BIN_DIR: ${{ env.VENV_DIR }}/bin
        run: ./build_tools/cmake/build_mips_r6.sh "${IREE_TARGET_BUILD_DIR}"
      - name: Test mips64 r6 + MSA
        # QEMU user-mode is CPU-bound and the runner has ~4 vCPUs, so cap ctest
        # parallelism below that to keep the heavy data-tiled matmuls within
        # their per-test timeout under soft-float emulation.
        env:
          CTEST_PARALLEL_LEVEL: 2
        run: ./build_tools/cmake/test_mips_r6.sh "${IREE_TARGET_BUILD_DIR}"
