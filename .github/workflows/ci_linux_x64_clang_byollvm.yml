name: CI - Linux x64 clang BYO LLVM

on:
  schedule:
    # Weekday mornings at 09:15 UTC = 01:15 PST (UTC - 8).
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux_x64_clang_byollvm:
    if: ${{ github.repository_owner == 'iree-org' || github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    container: ghcr.io/iree-org/cpubuilder_ubuntu_jammy@sha256:78a558b999b230f7e1da376639e14b44f095f30f1777d6a272ba48c0bbdd4ccb
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install Python requirements
        run: python3 -m pip install -r ./build_tools/github_actions/ci_requirements.txt
      - name: "Building and testing with bring-your-own-LLVM"
        env:
          SCCACHE_AZURE_CONNECTION_STRING: "${{ secrets.AZURE_CCACHE_CONNECTION_STRING }}"
          SCCACHE_AZURE_BLOB_CONTAINER: ccache-container
          SCCACHE_CACHE_ZSTD_LEVEL: 10
          SCCACHE_AZURE_KEY_PREFIX: "ci_linux_x64_clang_byollvm"
          # TODO: Remove when the ubuntu-24.04 runner image has a kernel with
          # https://github.com/torvalds/linux/commit/4de32fd05ce9.
          # On kernel 7.0.0-1017-azure, AppArmor dereferences a NULL pointer
          # when a confined process writes to a connected AF_UNIX datagram
          # socket. In this container, that ends the main thread of
          # socket_tests in UnixDgram_ConnectedLoopback, and the test hangs
          # until the ctest timeout.
          IREE_EXTRA_NEWLINE_SEPARATED_CTEST_TESTS_TO_EXCLUDE: |-
            iree/async/platform/posix/cts/socket_tests
        run: |
          source ./build_tools/cmake/setup_sccache.sh
          ./build_tools/cmake/build_and_test_byo_llvm.sh

      - name: Post to Discord on Failure
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        if: failure() && github.ref_name == 'main' && github.repository_owner == 'iree-org'
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          description: "The ${{ github.workflow }} workflow failed"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
