# Workflow for little-endian MIPS64 (mips64el) VMVX-only runtime cross-compilation
# and test jobs, run under QEMU user-mode emulation. The concurrency of this
# workflow is controlled by the caller's job.
#
# Like the big-endian job (pkgci_test_mips64_be.yml) this needs no custom-hosted
# toolchain or QEMU: both the cross GCC and qemu-mips64el come from the Ubuntu
# archive. The build/test scripts default to little-endian, so no overrides are
# required here.

name: PkgCI Test MIPS64

on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      write-caches:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      write-caches:
        required: true
        type: string

permissions:
  contents: read

jobs:
  mips64:
    runs-on: ubuntu-24.04
    env:
      PACKAGE_DOWNLOAD_DIR: ${{ github.workspace }}/.packages
      VENV_DIR: ${{ github.workspace }}/.venv
      GH_TOKEN: ${{ github.token }}
      IREE_TARGET_BUILD_DIR: build-mips
    steps:
      # General setup.
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Checking out runtime submodules"
        run: ./build_tools/scripts/git/update_runtime_submodules.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must match the subset of versions built in pkgci_build_packages.
          python-version: "3.11"
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          save: ${{ inputs.write-caches == 1 }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.artifact_run_id == '' }}
        with:
          name: linux_x86_64_release_packages
          path: ${{ env.PACKAGE_DOWNLOAD_DIR }}
      - name: Install build and QEMU dependencies
        # gcc-mips64el-linux-gnuabi64 provides the little-endian cross toolchain
        # and the /usr/mips64el-linux-gnuabi64 sysroot used as the QEMU loader
        # prefix; qemu-user provides qemu-mips64el.
        run: |
          sudo apt update
          sudo apt install -y ninja-build \
            gcc-mips64el-linux-gnuabi64 g++-mips64el-linux-gnuabi64 qemu-user
      - name: Setup base venv
        run: |
          ./build_tools/pkgci/setup_venv.py ${VENV_DIR} \
            --artifact-path=${PACKAGE_DOWNLOAD_DIR} \
            --fetch-gh-workflow=${{ inputs.artifact_run_id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build mips64 little-endian runtime
        env:
          IREE_HOST_BIN_DIR: ${{ env.VENV_DIR }}/bin
        run: ./build_tools/cmake/build_mips.sh "${IREE_TARGET_BUILD_DIR}"
      - name: Test mips64 little-endian runtime
        run: ./build_tools/cmake/test_mips.sh "${IREE_TARGET_BUILD_DIR}"
