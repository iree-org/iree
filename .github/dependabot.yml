version: 2
updates:

  # Check for updates to GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so that a compromised
    # release is likely to be yanked before it reaches a PR. Security
    # updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
